<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LP 턴테이블</title>
  <meta name="description" content="앨범마다 다른 LP를 턴테이블에 올려 듣는 곳">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="lp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <section class="screen crate-screen" id="crate-screen" aria-labelledby="crate-heading">
      <div class="backdrop" aria-hidden="true"></div>
      <header class="crate-head">
        <div>
          <h1 class="brand" id="crate-heading">
          <span class="sr-only">lp</span>
          <!-- "lp" whose p is a record: the stem is the tonearm's post, the bowl the disc -->
          <svg class="logo" viewBox="0 0 104 100" aria-hidden="true">
            <rect x="4" y="4" width="12" height="70" rx="6" fill="currentColor"/>
            <rect x="26" y="28" width="12" height="68" rx="6" fill="currentColor"/>
            <g class="logo-disc">
              <circle cx="67" cy="51" r="27" fill="#0b0a09" stroke="currentColor" stroke-width="6"/>
              <circle cx="67" cy="51" r="19.5" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width=".9"/>
              <circle cx="67" cy="51" r="15.5" fill="none" stroke="currentColor" stroke-opacity=".16" stroke-width=".9"/>
              <path d="M67 51 L86 33 A27 27 0 0 1 91 42 Z" fill="currentColor" fill-opacity=".12"/>
              <circle cx="67" cy="51" r="9.5" fill="var(--accent)"/>
              <rect x="61.5" y="45" width="7" height="2.2" rx="1.1" fill="#0b0a09" fill-opacity=".55"/>
              <circle cx="67" cy="51" r="1.8" fill="#0b0a09"/>
            </g>
          </svg>
        </h1>
          <p class="crate-sub">오늘 들을 레코드를 골라요</p>
        </div>
        <p class="eyebrow crate-count" id="crate-count"></p>
      </header>
      <div class="crate" id="crate"></div>
      <p class="eyebrow crate-hint">넘겨서 고르고 · 눌러서 꺼내요</p>
    </section>
    <section class="screen deck-screen" id="deck-screen" aria-label="턴테이블" hidden>
      <div class="backdrop" aria-hidden="true"></div>
      <button type="button" class="back" id="back">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        레코드 고르기
      </button>
      <div class="deck" id="deck"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
