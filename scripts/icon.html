<!doctype html>
<!-- Draws the home-screen icon from icons/icon.svg at the size asked for. Render with a headless browser, e.g.
     msedge --headless=new --hide-scrollbars --window-size=180,180 --screenshot=icons/icon-180.png "scripts/icon.html?s=180" -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#070606;overflow:hidden}img{display:block}</style>
<img id="i" src="../icons/icon.svg" alt="">
<script>
const S = Number(new URLSearchParams(location.search).get('s')) || Math.min(innerWidth, innerHeight);
document.getElementById('i').width = document.getElementById('i').height = S;
</script>
